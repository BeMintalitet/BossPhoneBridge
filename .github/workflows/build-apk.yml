name: Build Boss Phone Bridge APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BossPhoneBridge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test Boss Device Connector
        working-directory: connector
        run: node test.mjs

      - name: Build APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BossPhoneBridge-APK
          path: BossPhoneBridge/app/build/outputs/apk/debug/app-debug.apk
